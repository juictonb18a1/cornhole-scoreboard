<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cornhole" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A simple cornhole scoreboard for two teams." />
    <title>Cornhole Scoreboard</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css?v=6" />
  </head>
  <body>
    <main class="scoreboard" aria-label="Cornhole scoreboard">
      <section class="team team-a" aria-labelledby="team-a-name" data-color="green">
        <header class="team-label">
          <input class="team-name" id="team-a-name" data-team="a" maxlength="18" value="Team A" aria-label="Team A name" />
          <div class="palette" aria-label="Team A color">
            <button class="color-swatch is-selected" type="button" data-team="a" data-color="green" aria-label="Set Team A color to green"></button>
            <button class="color-swatch" type="button" data-team="a" data-color="blue" aria-label="Set Team A color to blue"></button>
            <button class="color-swatch" type="button" data-team="a" data-color="purple" aria-label="Set Team A color to purple"></button>
            <button class="color-swatch" type="button" data-team="a" data-color="gold" aria-label="Set Team A color to gold"></button>
            <button class="color-swatch" type="button" data-team="a" data-color="red" aria-label="Set Team A color to red"></button>
            <button class="color-swatch" type="button" data-team="a" data-color="slate" aria-label="Set Team A color to slate"></button>
          </div>
        </header>
        <button class="score-hit score-up" type="button" data-team="a" data-action="up" aria-label="Add one point to Team A">
          <span class="score-value" id="score-a">0</span>
          <span class="score-action">+1</span>
        </button>
        <button class="score-hit score-down" type="button" data-team="a" data-action="down" aria-label="Subtract one point from Team A">
          <span class="score-action">-1</span>
        </button>
      </section>

      <div class="center-controls" aria-live="polite">
        <p class="status" id="status"></p>
        <button class="reset-button" type="button" id="reset">Reset</button>
      </div>

      <section class="team team-b" aria-labelledby="team-b-name" data-color="red">
        <header class="team-label">
          <input class="team-name" id="team-b-name" data-team="b" maxlength="18" value="Team B" aria-label="Team B name" />
          <div class="palette" aria-label="Team B color">
            <button class="color-swatch" type="button" data-team="b" data-color="green" aria-label="Set Team B color to green"></button>
            <button class="color-swatch" type="button" data-team="b" data-color="blue" aria-label="Set Team B color to blue"></button>
            <button class="color-swatch" type="button" data-team="b" data-color="purple" aria-label="Set Team B color to purple"></button>
            <button class="color-swatch" type="button" data-team="b" data-color="gold" aria-label="Set Team B color to gold"></button>
            <button class="color-swatch is-selected" type="button" data-team="b" data-color="red" aria-label="Set Team B color to red"></button>
            <button class="color-swatch" type="button" data-team="b" data-color="slate" aria-label="Set Team B color to slate"></button>
          </div>
        </header>
        <button class="score-hit score-up" type="button" data-team="b" data-action="up" aria-label="Add one point to Team B">
          <span class="score-value" id="score-b">0</span>
          <span class="score-action">+1</span>
        </button>
        <button class="score-hit score-down" type="button" data-team="b" data-action="down" aria-label="Subtract one point from Team B">
          <span class="score-action">-1</span>
        </button>
      </section>
    </main>

    <script src="app.js?v=6"></script>
  </body>
</html>
